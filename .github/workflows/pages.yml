name: Deploy ChronoBible public site to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble public site artifact
        run: |
          set -e
          rm -rf _public
          mkdir -p _public/assets/illustrations _public/download
          cp index.html atlas.css atlas.js timeline-data.js _public/
          cp -R assets/illustrations/. _public/assets/illustrations/
          cp -R download/. _public/download/
          touch _public/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
